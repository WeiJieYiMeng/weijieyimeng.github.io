  <script>
    styleFit.all();
    localStorage.setItem("lastPage",location.pathname);
    const B=localStorage.getItem("B");
    if(B === null){
      document.querySelector(".turnRight").style.display ="none";
      document.querySelector("#lastRead").innerHTML=`<a href="/res/io.html">导入阅读记录 io&gt;</a>`
    }
    else{
      document.querySelector("#lastRead").innerHTML=`<a href="javascript:lastRead()">${B+"("+localStorage.getItem(B)+"页)"}<br/>继续阅读&gt;</a>`
    }
    function lastRead(){
      location.href=`/text.html?b=${B}`
    }
    var s2blist=Array(books.length);
    for(let i=0;i<books.length;i++){s2blist[i]=books[i].book}
    function getBookDiv(num){
      let newBar=document.createElement("div");
      let inHtml=`<b onclick=\"location.href=\'\/book.html?b=${books[num].book}\'\">${books[num].name}</b>`
      if('non' in books[num]){books[num].non?true: inHtml="<span style='color:#666666'>"+inHtml+"</span>" };
      inHtml+=`<hr/><div style="font-size:70%">《味界一梦：${books[num].book}》<br/>${books[num].nation} | ${books[num].char}`;
      if(!('non' in books[num])){
        if(localStorage.getItem(books[num].book) === null){
          inHtml+=`<a href=\"javascript:location.href=\'\/book.html?b=${books[num].book}\'\"><br/>开始阅读&gt;</a>`
        }else{
          inHtml+=`<a href=\"javascript:location.href=\'\/text.html?b=${books[num].book}\'\"><br/>上次读到${localStorage.getItem(books[num].book)}页 继续阅读&gt;</a>`
        }
      }else{
        inHtml+=books[num].non?"<a href=\"javascript:location.href=\'\/text.html?b=${books[num].book}\'\"><br/>本书仅简介</a>":"<br/>本书未开放";
      }
      newBar.innerHTML=inHtml+"</div>"
      newBar.className="bars"
      return newBar;
    }
    function showBooks(){
      document.querySelector("#books").innerHTML="<br/>";
      for(let i=0;i<show.length;i++){
        document.querySelector("#books").appendChild(document.createElement("hr"));
        let outBar=document.createElement("div");
        outBar.innerHTML+=`<b style="display:block;padding:1.3rem 0 0">〇${show[i][0]}</b>`;
        for(let j=0;j<show[i][1].length;j++){
          outBar.appendChild(getBookDiv(s2blist.indexOf(show[i][1][j])));
        }
        document.querySelector("#books").appendChild(outBar);
      }
    }
    function allBooks(){
      document.querySelector("#books").innerHTML="";
      for(let i=0;i<books.length;i++){
        document.querySelector("#books").appendChild(getBookDiv(i));
      }
    }
    window.addEventListener("message",(event)=>{
      if(event.origin!=location.origin)throw new Error("通信非同源");
      if(event.data.listenAct=="start")window.top.postMessage({listenText:"欢迎回到味界一梦。您上次读到："+document.querySelector("#lastRead").textContent+"。进入阅读页面时将自动开始阅读！"});
      if(event.data.listenAct=="next")window.top.postMessage({listenAct:"stop"});
    })
    window.onload=showBooks();
  </script>
